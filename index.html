<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Veil War — Launching Sandbox</title>
  <!--
    Repo-root entry for local clones and alternate Pages sources.
    Live GitHub Pages (gh-pages) publishes web-sandbox as site root, so
    https://thesithunyein.github.io/veil-war/ serves the game directly.
  -->
  <meta http-equiv="refresh" content="0; url=./web-sandbox/" />
  <link rel="canonical" href="https://thesithunyein.github.io/veil-war/" />
  <script>
    (function () {
      var pages = "https://thesithunyein.github.io/veil-war/";
      var local = "./web-sandbox/";
      // Prefer live Pages when opened from github.io; else local sandbox folder
      var host = location.hostname || "";
      var target = /github\.io$/i.test(host) ? "./" : local;
      // If this file is already the Pages root game, do nothing (deploy overwrites).
      // On main-branch / local: go to web-sandbox.
      if (!/github\.io$/i.test(host)) {
        location.replace(local);
        return;
      }
      location.replace(target);
    })();
  </script>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      display: grid;
      place-items: center;
      background: #03060d;
      color: #5ef2a8;
      font-family: "DM Sans", system-ui, sans-serif;
    }
    a { color: #7dd3fc; }
  </style>
</head>
<body>
  <p>
    Launching Veil War sandbox…
    <a href="./web-sandbox/">Open web-sandbox</a>
    ·
    <a href="https://thesithunyein.github.io/veil-war/">Live GitHub Pages</a>
  </p>
</body>
</html>
